plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '1.1.19'
	// Same version as the jOOQ runtime Spring Boot manages (3.21.7 with Boot 4.1.1).
	id 'org.jooq.jooq-codegen-gradle' version '3.21.10'
	id 'net.ltgt.errorprone' version '5.2.0'
}

group = 'top.ddupan.iam'
version = '0.0.1-SNAPSHOT'
description = 'Independent IAM: AD and passkey login with an in-process OAuth 2.0 / OIDC authorization server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-data-ldap'
	// ActiveDirectoryLdapAuthenticationProvider: AD bind, sub-code translation and the user's entry.
	implementation 'org.springframework.security:spring-security-ldap'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.security:spring-security-webauthn'
	// The schema is read from the Flyway scripts themselves: no database at build time.
	jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.10'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	errorprone 'com.google.errorprone:error_prone_core:2.53.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-ldap-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-ldap'
	testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'com.unboundid:unboundid-ldapsdk'
	testImplementation 'org.testcontainers:testcontainers-grafana'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Static analysis at compile time: javac lint and Error Prone warnings fail the build (and so CI) for our own
// sources. Generated code (jOOQ tables, Spring AOT sources) is not ours to fix. "processing" only reports that
// no annotation processor claimed the (runtime) annotations.
tasks.named('compileJava') { options.compilerArgs += ['-Xlint:all,-processing', '-Werror'] }
tasks.named('compileTestJava') { options.compilerArgs += ['-Xlint:all,-processing', '-Werror'] }
tasks.withType(JavaCompile).configureEach {
	options.errorprone {
		disableWarningsInGeneratedCode = true
		excludedPaths = '.*/build/generated[^/]*/.*'
	}
}

// Run generated AOT test context on the JVM before the more expensive native compile.
tasks.register('testAot', Test) {
	dependsOn tasks.named('aotTestClasses')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath + sourceSets.aotTest.output
	systemProperty 'spring.aot.enabled', 'true'
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

// Native bakes @ConditionalOnProperty decisions in at AOT time: the binary is built with the production
// feature set (application-prod.yaml) and must run with the same profile. -PaotArgs adds/overrides.
tasks.named('processAot') {
	args(['--spring.profiles.active=prod'] + providers.gradleProperty('aotArgs').map { it.trim().split(/\s+/) as List }.getOrElse([]))
}

// Native tests check behavior, not throughput. Keep the application binary optimized.
graalvmNative {
	binaries {
		// native-image takes 80% of the container as heap by default, and its off-heap use (~1.4 GB) plus the
		// Gradle daemon then push past CI's 7g (IAM_BUILD_MEMORY in ci.yml): the kernel killed it (exit 137)
		// twice on 2026-11-12. A fixed heap makes the builder collect sooner instead.
		main {
			jvmArgs.add('-Xmx5g')
		}
		test {
			quickBuild = true
			runtimeArgs.add(providers.systemProperty('user.home').map { "-Duser.home=${it}" })
		}
	}
}

// Vite owns the HTML and hashed assets; only the controller can serve the page shell.
// Build it with `npm ci && npm run build` in frontend/ before invoking Gradle.
tasks.named('processResources') {
    inputs.files(fileTree('frontend/dist'))
    doFirst {
        if (!file('frontend/dist/index.html').exists()) {
            throw new GradleException('Missing UI build: run npm ci && npm run build in frontend/')
        }
    }
    from('frontend/dist') { into 'ui' }
}

// Explicit test-only entry point for browser WebAuthn ceremonies; no fixture endpoints in production.
tasks.register('webauthnBrowserFixture', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.ddupan.iam.login.WebAuthnBrowserFixture'
}

// Test-only browser application with the authorization server and one fixture client.
tasks.register('authorizationServerBrowserFixture', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.ddupan.iam.login.WebAuthnBrowserFixture'
    systemProperty 'iam.fixture.authorization-server', 'true'
}

// Spike: simulated AD + fixture client for a native binary under browser test. -PsmokeArgs='<jdbc> <user> <pw>'
tasks.register('nativeSmokeSupport', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.ddupan.iam.login.NativeSmokeSupport'
    args(providers.gradleProperty('smokeArgs').map { it.trim().split(/\s+/) as List }.getOrElse([]))
}

// Spike: fixture clients for the OpenID conformance suite (driven by a Playwright browser with a passkey).
tasks.register('conformanceFixture', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.ddupan.iam.login.WebAuthnBrowserFixture'
    systemProperty 'iam.fixture.conformance', 'true'
}


// Typed tables and columns for the SQL this service writes, generated from the Flyway migrations
// (including the framework schemas copied there), so a renamed column fails compilation, not a query.
jooq {
	configuration {
		generator {
			database {
				name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
				properties {
					property { key = 'scripts'; value = 'build/jooq-ddl/*.sql' }
					property { key = 'sort'; value = 'flyway' }
					property { key = 'defaultNameCase'; value = 'lower' }
				}
			}
			generate {
				// Records and table references only; no DAOs or POJOs (no reflection for native).
				daos = false
				pojos = false
			}
			target {
				packageName = 'top.ddupan.iam.login.persistence.schema'
			}
		}
	}
}

// DDLDatabase simulates the DDL on H2, which cannot index text columns (nor build hash indexes). Indexes do not
// shape the generated code, so a copy without them is parsed; the applied migrations stay byte-for-byte unchanged
// (Flyway checksums). Every CREATE INDEX in the migrations is a single line.
tasks.register('jooqDdl', Copy) {
	from 'src/main/resources/db/migration'
	into layout.buildDirectory.dir('jooq-ddl')
	filter { String line -> line ==~ /(?i)\s*CREATE\s+(UNIQUE\s+)?INDEX\b.*/ ? '' : line }
}
tasks.named('jooqCodegen') {
	dependsOn tasks.named('jooqDdl')
	inputs.files(fileTree('src/main/resources/db/migration'))
}
tasks.named('compileJava') {
	dependsOn tasks.named('jooqCodegen')
}
