name: ci
# JVM checks run for every change on the shared pod pool (Docker inside the executor Pod). The native image
# (~11 min, ~5.5 GB peak, more than a pool Pod gets) runs only when dispatched by hand, in a "large" Pod (4 CPU /
# 9Gi, only the laptop's runner has this label). Not on every merge: it takes that capacity from the laptop's
# other services, and most merges (dependency bumps) need no release. Dispatched on main, the tested binary is
# also published to zot (scripts/publish-image), so releases are never rebuilt.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  jvm:
    # Each executor Pod is capped at 2 CPU / 4Gi (dynamic-runner LimitRange) and starts empty, so the
    # dependency caches come from the actions cache instead of the runner's disk.
    runs-on: [self-hosted, pod]
    env:
      IAM_GRADLE_CACHE: /tmp/iam-ci/gradle
      IAM_NPM_CACHE: /tmp/iam-ci/npm
      IAM_BUILD_CPUS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            /tmp/iam-ci/gradle/caches/modules-2
            /tmp/iam-ci/gradle/wrapper
            /tmp/iam-ci/npm
          key: iam-jvm-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'frontend/package-lock.json') }}
          restore-keys: iam-jvm-
      # Gradle and npm run in containers with these directories as their homes; Docker Hub pulls
      # (node, Testcontainers' Postgres) go through the job dockerd's mirror.
      - uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
        with:
          gradle: 'true'
          gradle-user-home: /tmp/iam-ci/gradle
          npm: 'true'
          npm-home: /tmp/iam-ci/npm
          docker: 'true'
      - name: JVM tests and boot jar
        env:
          # Leaves room in the Pod's 4Gi for dockerd and the Testcontainers database.
          IAM_BUILD_MEMORY: 3g
        # Test AOT is skipped until its fixture lifecycle issue is fixed (docs/native-validation.md).
        run: scripts/gradle-in-docker test bootJar -x processTestAot -x compileAotTestJava -x processAotTestResources
      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          for path in glob.glob("build/test-results/test/*.xml"):
              for case in E.parse(path).getroot().iter("testcase"):
                  for problem in case:
                      if problem.tag in ("failure", "error"):
                          print(f"{case.get('classname')}.{case.get('name')}: {(problem.get('message') or '')[:500]}")
          PY

  # The job key is the last segment of this job's SPIFFE ID, which zot's ACL for iam/iam-login names:
  # renaming it stops publishing.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: jvm
    runs-on: [self-hosted, container, large]
    env:
      IAM_GRADLE_CACHE: /tmp/iam-ci/gradle
      IAM_NPM_CACHE: /tmp/iam-ci/npm
      IAM_BUILD_CPUS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            /tmp/iam-ci/gradle/caches/modules-2
            /tmp/iam-ci/gradle/wrapper
            /tmp/iam-ci/npm
          key: iam-native-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'frontend/package-lock.json') }}
          restore-keys: |
            iam-native-
            iam-jvm-
      - uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
        with:
          gradle: 'true'
          gradle-user-home: /tmp/iam-ci/gradle
          npm: 'true'
          npm-home: /tmp/iam-ci/npm
          docker: 'true'
      - name: Native image
        env:
          IAM_BUILD_MEMORY: 7g
        run: scripts/gradle-in-docker nativeCompile
      - name: Native browser test
        env:
          IAM_BUILD_MEMORY: 3g
        run: scripts/native-smoke
      - name: Publish image
        # Only main ships; runs dispatched on another branch still build and test but publish nothing.
        if: github.ref == 'refs/heads/main'
        run: scripts/publish-image
