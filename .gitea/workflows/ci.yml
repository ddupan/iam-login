name: ci
# JVM checks run for every change on the shared pod pool (Docker inside the executor Pod). The native image
# (~11 min, ~5.5 GB peak, more than a pool Pod gets) runs only after a merge to main, or on demand, on the
# repository runner "iam-build": a host-mode runner in a disposable LXC on pve1 with persistent caches. On main
# the tested binary is also published to zot (scripts/publish-image), so releases are never rebuilt.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  jvm:
    # Each executor Pod is capped at 2 CPU / 4Gi (dynamic-runner LimitRange) and starts empty, so the
    # dependency caches come from the actions cache instead of the runner's disk.
    runs-on: [self-hosted, pod]
    env:
      IAM_GRADLE_CACHE: /tmp/iam-ci/gradle
      IAM_NPM_CACHE: /tmp/iam-ci/npm
      IAM_BUILD_CPUS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/iam-ci/gradle/caches/modules-2
            /tmp/iam-ci/gradle/wrapper
            /tmp/iam-ci/npm
          key: iam-jvm-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'frontend/package-lock.json') }}
          restore-keys: iam-jvm-
      - name: JVM tests and boot jar
        env:
          # Leaves room in the Pod's 4Gi for dockerd and the Testcontainers database.
          IAM_BUILD_MEMORY: 3g
        # Test AOT is skipped until its fixture lifecycle issue is fixed (docs/native-validation.md).
        run: scripts/gradle-in-docker test bootJar -x processTestAot -x compileAotTestJava -x processAotTestResources
      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          for path in glob.glob("build/test-results/test/*.xml"):
              for case in E.parse(path).getroot().iter("testcase"):
                  for problem in case:
                      if problem.tag in ("failure", "error"):
                          print(f"{case.get('classname')}.{case.get('name')}: {(problem.get('message') or '')[:500]}")
          PY

  native:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: jvm
    runs-on: iam-build
    env:
      IAM_GRADLE_CACHE: /srv/iam/ci/gradle
      IAM_NPM_CACHE: /srv/iam/ci/npm
      IAM_BUILD_CPUS: "4"
    steps:
      - name: Remove containers left by cancelled runs
        # Capacity 1: no other job of this runner is running, so every labelled container is an orphan.
        # A cancelled native run kept compiling and starved the next one of memory (2026-10-05).
        run: docker ps -aq --filter label=iam-login.ci=1 | xargs -r docker rm -f
      - uses: actions/checkout@v4
      - name: Native image
        env:
          IAM_BUILD_MEMORY: 7g
        run: scripts/gradle-in-docker nativeCompile
      - name: Native browser test
        env:
          IAM_BUILD_MEMORY: 3g
        run: scripts/native-smoke
      - name: Publish image
        # Only main ships; on-demand runs still build and test but publish nothing.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/publish-image
