spring:
  application:
    name: iam-login
  # AD connection (urls and base are set per environment; iam.ad.domain completes it). Users bind
  # with their own credentials; read-only contexts stay anonymous because there is no service
  # account, which is also all Boot's LDAP health check needs (it only opens a connection).
  ldap:
    anonymous-read-only: true
    base-environment:
      "[java.naming.referral]": ignore
      "[java.naming.ldap.attributes.binary]": objectGUID
      "[com.sun.jndi.ldap.connect.timeout]": "3000"
      "[com.sun.jndi.ldap.read.timeout]": "5000"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
