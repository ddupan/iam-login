name: ci
# GitHub-hosted runners (4 CPU / 16 GB for public repos) fit both the JVM checks and the native image (~11 min,
# ~5.5 GB peak), so both run on every change. On main the tested binary is uploaded with a build-provenance
# attestation; the homelab packages exactly that binary into the image it ships (no release rebuild).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only PRs cancel superseded runs: every main run must finish, its binary is what ships.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IAM_GRADLE_CACHE: /tmp/iam-ci/gradle
  IAM_NPM_CACHE: /tmp/iam-ci/npm
  IAM_BUILD_CPUS: "4"

jobs:
  jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            /tmp/iam-ci/gradle/caches/modules-2
            /tmp/iam-ci/gradle/wrapper
            /tmp/iam-ci/npm
          key: iam-jvm-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'frontend/package-lock.json') }}
          restore-keys: iam-jvm-
      - name: Maven Central mirror
        run: install -D -m 644 .github/gradle/central-mirror.init.gradle "$IAM_GRADLE_CACHE/init.d/central-mirror.gradle"
      - name: JVM tests and boot jar
        env:
          IAM_BUILD_MEMORY: 6g
        # Test AOT is skipped until its fixture lifecycle issue is fixed (docs/native-validation.md).
        run: scripts/gradle-in-docker test bootJar -x processTestAot -x compileAotTestJava -x processAotTestResources
      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          for path in glob.glob("build/test-results/test/*.xml"):
              for case in E.parse(path).getroot().iter("testcase"):
                  for problem in case:
                      if problem.tag in ("failure", "error"):
                          print(f"{case.get('classname')}.{case.get('name')}: {(problem.get('message') or '')[:500]}")
          PY

  native:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # provenance attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            /tmp/iam-ci/gradle/caches/modules-2
            /tmp/iam-ci/gradle/wrapper
            /tmp/iam-ci/npm
          key: iam-native-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'frontend/package-lock.json') }}
          restore-keys: |
            iam-native-
            iam-jvm-
      - name: Maven Central mirror
        run: install -D -m 644 .github/gradle/central-mirror.init.gradle "$IAM_GRADLE_CACHE/init.d/central-mirror.gradle"
      - name: Native image
        env:
          IAM_BUILD_MEMORY: 10g
        run: scripts/gradle-in-docker nativeCompile
      - name: Native browser test
        env:
          IAM_BUILD_MEMORY: 4g
        run: scripts/native-smoke
      - name: Attest binary provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/native/nativeCompile/iam-login
      - name: Upload binary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: iam-login-linux-amd64
          path: build/native/nativeCompile/iam-login
          if-no-files-found: error

  # Ships the binary the native job tested: on the homelab ARC runner (runs-on: homelab), because zot
  # is LAN-only and authorizes by SPIFFE ID. The SVID comes from spire-identity-exchange, and its
  # SPIRE entry (homelab-infra platform/spire/github-ci.yaml) matches only this repository's ci.yml
  # on refs/heads/main for push events; a branch or PR run could not get it even on this runner.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [jvm, native]
    runs-on: homelab
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token, one half of the exchange's proof
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: iam-login-linux-amd64
          path: build/native/nativeCompile
      # Artifacts do not keep file modes.
      - run: chmod 755 build/native/nativeCompile/iam-login
      - id: svid
        uses: ddupan/ci-actions/spiffe-jwt-svid@v1
        with:
          audience: zot
      - name: Log in to zot
        env:
          SVID: ${{ steps.svid.outputs.svid }}
        run: |
          DOCKER_CONFIG=$(mktemp -d)
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >>"$GITHUB_ENV"
          printf '%s' "$SVID" | DOCKER_CONFIG=$DOCKER_CONFIG docker login zot.lab.ddupan.top --username zot --password-stdin >/dev/null
      - name: Publish image
        run: scripts/publish-image
      - name: Remove registry credentials
        if: always()
        run: rm -rf -- "${DOCKER_CONFIG:-/nonexistent}"
